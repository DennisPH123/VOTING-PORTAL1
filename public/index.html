<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swahili Beach - Employee Voting Portal</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .container { 
            width: 100%;
            max-width: 400px; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); 
            text-align: center; 
        }
        .logo { max-width: 140px; display: block; margin: 0 auto 20px; }
        input, button { width: calc(100% - 22px); padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 6px; }
        input { border: 1px solid #ccc; border-radius: 4px; }
        .btn { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #218838; }
        .error { color: #dc3545; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Swahili Beach Logo" class="logo" onerror="this.style.display='none'">
    <h2>Employee Voting Portal</h2>
    <p style="color: #666; font-size: 14px;">Enter your Employee Number / Tag ID to vote</p>
    
    <input type="text" id="voter-tag" placeholder="e.g. ACT1505 or ADM 010">
    <button class="btn" onclick="loginVoter()">Login to Vote</button>
    <div id="error-msg" class="error"></div>
</div>

<script>
    async function loginVoter() {
        const tag = document.getElementById('voter-tag').value.trim();
        const errorDiv = document.getElementById('error-msg');
        errorDiv.textContent = '';

        if (!tag) {
            errorDiv.textContent = 'Please enter your employee number.';
            return;
        }

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tag })
            });

            const data = await res.json();
            if (data.success) {
                localStorage.setItem('voter', JSON.stringify(data.voter));
                window.location.href = 'voting.html';
            } else {
                errorDiv.textContent = data.message || 'Invalid Employee Number.';
            }
        } catch (err) {
            errorDiv.textContent = 'Network error. Please try again.';
        }
    }
</script>

</body>
</html>

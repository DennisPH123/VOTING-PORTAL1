<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swahili Beach - Official Ballot</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .container { max-width: 700px; margin: 30px auto; background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .logo { max-width: 140px; display: block; margin: 0 auto 20px; }
        h1, h2 { color: #2c3e50; text-align: center; }
        .category-box { background: #fafbfc; border: 1px solid #e1e4e8; padding: 20px; border-radius: 6px; margin-bottom: 20px; }
        .nominees-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        .nominee-card { border: 2px solid #ddd; border-radius: 6px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; background: white; }
        .nominee-card:hover { border-color: #0056b3; background: #f0f8ff; }
        .nominee-card.selected { border-color: #28a745; background: #e8f5e9; }
        .nominee-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    <h2>Official Voting Ballot</h2>
    <p id="welcome-msg" style="text-align: center; font-weight: bold; color: #555;"></p>

    <div id="ballot-container">Loading ballot categories...</div>

    <button class="btn" id="submit-btn" onclick="submitVotes()">Submit All Votes</button>
</div>

<script>
    let voter = JSON.parse(localStorage.getItem('voter'));
    if (!voter) {
        window.location.href = 'index.html';
    } else {
        document.getElementById('welcome-msg').textContent = `Voting as: ${voter.name} (${voter.tag})`;
    }

    let selectedVotes = {}; // { categoryId: nomineeId }

    async function loadBallot() {
        const res = await fetch('/api/voting-data');
        const data = await res.json();
        
        let html = '';
        data.categories.forEach(cat => {
            html += `
                <div class="category-box">
                    <h3>${cat.name}</h3>
                    <div class="nominees-grid">
                        ${cat.nominees.map(n => `
                            <div class="nominee-card" id="card-${cat.id}-${n.id}" onclick="selectNominee('${cat.id}', '${n.id}')">
                                <img src="${n.photo}" class="nominee-img">
                                <div><strong>${n.name || n.nomineeName || n.fullName || 'Nominee'}</strong></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
        document.getElementById('ballot-container').innerHTML = html;
    }

    function selectNominee(categoryId, nomineeId) {
        document.querySelectorAll(`[id^="card-${categoryId}-"]`).forEach(el => el.classList.remove('selected'));
        document.getElementById(`card-${categoryId}-${nomineeId}`).classList.add('selected');
        selectedVotes[categoryId] = nomineeId;
    }

    async function submitVotes() {
        if (Object.keys(selectedVotes).length === 0) {
            alert('Please select at least one nominee before submitting.');
            return;
        }

        try {
            for (const [categoryId, nomineeId] of Object.entries(selectedVotes)) {
                await fetch('/api/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        tag: voter.tag, 
                        categoryId: categoryId, 
                        nomineeId: nomineeId 
                    })
                });
            }

            alert('Thank you! Your votes have been successfully recorded.');
            localStorage.removeItem('voter');
            window.location.href = 'index.html';
        } catch (err) {
            alert('Network error while submitting votes. Please try again.');
        }
    }

    loadBallot();
</script>

</body>
</html>

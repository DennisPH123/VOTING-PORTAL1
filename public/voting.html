<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Ballot - Employee Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #f0f2f5; padding-bottom: 20px; }
        .header h1 { color: #2c3e50; margin: 0 0 10px 0; }
        .welcome-banner { font-size: 1.2rem; color: #16a085; font-weight: 600; }
        .category-box { background: #fdfefe; border: 1px solid #e1e8ed; padding: 25px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .category-box h3 { margin-top: 0; color: #34495e; font-size: 1.3rem; }
        .nominees-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 15px; }
        .nominee-card { border: 2px solid #e1e8ed; border-radius: 10px; padding: 15px; width: 150px; text-align: center; background: white; cursor: pointer; transition: all 0.2s ease; }
        .nominee-card img { width: 110px; height: 110px; object-fit: cover; border-radius: 50%; margin-bottom: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .nominee-card:hover { border-color: #3498db; transform: translateY(-3px); }
        .nominee-card.selected { border-color: #2ecc71; background: #e8f8f5; box-shadow: 0 4px 12px rgba(46,204,113,0.2); }
        .global-submit-btn { background-color: #2ecc71; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; width: 100%; margin-top: 20px; transition: background 0.2s; box-shadow: 0 4px 10px rgba(46,204,113,0.3); }
        .global-submit-btn:hover { background-color: #27ae60; }
        .voted-msg { color: #27ae60; font-weight: bold; background: #e8f8f5; padding: 12px; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Employee Voting Portal</h1>
            <div id="welcomeMessage" class="welcome-banner">Loading your ballot...</div>
        </div>
        
        <div id="ballotContainer"></div>
        
        <button id="submitAllBtn" class="global-submit-btn" style="display: none;" onclick="submitAllVotes()">Submit All Votes</button>
    </div>

    <script>
        let selectedVotes = {};

        async function loadBallot() {
            const res = await fetch('/api/voter/ballot-data');
            if (res.status === 401) { window.location.href = '/index.html'; return; }
            const data = await res.json();

            document.getElementById('welcomeMessage').textContent = `Welcome, ${data.employeeName}! 👋`;

            const container = document.getElementById('ballotContainer');
            container.innerHTML = '';

            const unvotedCategories = data.categories.filter(cat => !data.votedCategories.includes(cat.id));

            if (data.categories.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#7f8c8d;">No active voting categories available at the moment.</p>';
                return;
            }

            data.categories.forEach(cat => {
                const isVoted = data.votedCategories.includes(cat.id);
                const catNominees = data.nominees.filter(n => n.category_id === cat.id);

                let html = `<div class="category-box">
                    <h3>📂 ${cat.name}</h3>`;

                if (isVoted) {
                    html += `<div class="voted-msg">✔ Vote successfully recorded for this category. Thank you!</div>`;
                } else {
                    html += `<div class="nominees-grid">`;
                    catNominees.forEach(nom => {
                        const imgSrc = nom.image ? nom.image : 'https://via.placeholder.com/110?text=No+Photo';
                        const isSelected = selectedVotes[cat.id] === nom.id ? 'selected' : '';
                        html += `
                            <div class="nominee-card ${isSelected}" id="card-${cat.id}-${nom.id}" onclick="selectNominee(${cat.id}, ${nom.id})">
                                <img src="${imgSrc}" alt="${nom.name}">
                                <div><strong>${nom.name}</strong></div>
                            </div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
                container.innerHTML += html;
            });

            if (unvotedCategories.length > 0) {
                document.getElementById('submitAllBtn').style.display = 'block';
            } else {
                document.getElementById('submitAllBtn').style.display = 'none';
            }
        }

        function selectNominee(catId, nomineeId) {
            document.querySelectorAll(`[id^="card-${catId}-"]`).forEach(card => card.classList.remove('selected'));
            document.getElementById(`card-${catId}-${nomineeId}`).classList.add('selected');
            selectedVotes[catId] = nomineeId;
        }

        async function submitAllVotes() {
            if (Object.keys(selectedVotes).length === 0) {
                alert('Please select at least one nominee before submitting.');
                return;
            }

            if (!confirm('Are you sure you want to submit your votes? You cannot change them after submission.')) {
                return;
            }

            const res = await fetch('/api/voter/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ votes: selectedVotes })
            });
            const result = await res.json();
            if (result.success) {
                alert('All your votes have been cast successfully! Thank you.');
                selectedVotes = {};
                loadBallot();
            } else {
                alert(result.error);
            }
        }

        loadBallot();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Swahili Beach Voting</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .logo-banner { max-width: 180px; display: block; margin: 0 auto 15px; }
        h1, h2 { color: #2c3e50; text-align: center; }
        .section { background: #fafbfc; border: 1px solid #e1e4e8; padding: 20px; border-radius: 6px; margin-bottom: 20px; }
        input, select, button { padding: 10px; margin: 5px 0; font-size: 15px; }
        input[type="text"], select { width: calc(100% - 22px); display: block; }
        .btn { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-info { background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 8px 15px; font-weight: bold; }
        .btn-danger { background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 5px 10px; }
        .nominee-row { display: flex; align-items: center; justify-content: space-between; background: white; padding: 10px; border: 1px solid #ddd; margin-top: 5px; border-radius: 4px; }
        .nominee-info { display: flex; align-items: center; gap: 10px; }
        .thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .tally-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container" id="login-section">
    <img src="logo.png" alt="Swahili Beach Logo" class="logo-banner" onerror="this.style.display='none'">
    <h2>Admin Login</h2>
    <input type="password" id="admin-pass" placeholder="Enter Admin Password">
    <button class="btn" onclick="adminLogin()" style="width: 100%;">Login</button>
</div>

<div class="container" id="dashboard-section" style="display:none;">
    <img src="logo.png" alt="Swahili Beach Logo" class="logo-banner" onerror="this.style.display='none'">
    <h2>Admin Dashboard</h2>
    
    <div class="section">
        <h3>Add Category</h3>
        <input type="text" id="category-name" placeholder="Category Name (e.g., Best Chef)">
        <button class="btn" onclick="addCategory()">Create Category</button>
    </div>

    <div class="section">
        <h3>Add Nominee</h3>
        <select id="nominee-category-select"></select>
        <input type="text" id="nominee-name" placeholder="Nominee Full Name">
        <input type="file" id="nominee-photo" accept="image/*">
        <button class="btn" onclick="addNominee()">Add Nominee</button>
    </div>

    <div class="section">
        <div class="tally-header">
            <h3 style="margin: 0;">Live Vote Tally</h3>
            <button class="btn-info" onclick="loadDashboardData()">🔄 Refresh Tally</button>
        </div>
        <div id="admin-categories-list">Loading...</div>
    </div>
</div>

<script>
    async function adminLogin() {
        const password = document.getElementById('admin-pass').value;
        const res = await fetch('/api/admin-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            loadDashboardData();
        } else {
            alert('Incorrect password');
        }
    }

    async function loadDashboardData() {
        const res = await fetch('/api/voting-data');
        const data = await res.json();
        
        let selectHtml = '';
        let listHtml = '';

        data.categories.forEach(cat => {
            selectHtml += `<option value="${cat.id}">${cat.name}</option>`;
            
            listHtml += `
                <div style="background: white; border: 1px solid #dcdcdc; padding: 15px; border-radius: 6px; margin-bottom: 15px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h4 style="margin: 0; color: #0056b3;">${cat.name}</h4>
                        <button class="btn-danger" onclick="deleteCategory('${cat.id}')">Delete Category</button>
                    </div>
                    <div style="margin-left: 10px;">
            `;

            if (cat.nominees.length === 0) {
                listHtml += `<p style="color: #888; font-style: italic; margin: 5px 0;">No nominees added yet.</p>`;
            }

            cat.nominees.forEach(n => {
                listHtml += `
                    <div class="nominee-row">
                        <div class="nominee-info">
                            <img src="${n.photo}" class="thumb">
                            <span><strong>${n.name || n.nomineeName || 'Unnamed'}</strong> - Votes: <strong style="color: #28a745; font-size: 18px;">${n.votes}</strong></span>
                        </div>
                        <button class="btn-danger" onclick="deleteNominee('${cat.id}', '${n.id}')">Remove</button>
                    </div>
                `;
            });

            listHtml += `</div></div>`;
        });

        document.getElementById('nominee-category-select').innerHTML = selectHtml;
        document.getElementById('admin-categories-list').innerHTML = listHtml;
    }

    async function addCategory() {
        const name = document.getElementById('category-name').value;
        if (!name) return alert('Enter category name');
        
        await fetch('/api/admin/category', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        document.getElementById('category-name').value = '';
        loadDashboardData();
    }

    async function deleteCategory(id) {
        if(!confirm('Are you sure you want to delete this category?')) return;
        await fetch(`/api/admin/category/${id}`, { method: 'DELETE' });
        loadDashboardData();
    }

    async function addNominee() {
        const categoryId = document.getElementById('nominee-category-select').value;
        const name = document.getElementById('nominee-name').value;
        const photoFile = document.getElementById('nominee-photo').files[0];

        if (!name) return alert('Enter nominee name');

        const formData = new FormData();
        formData.append('categoryId', categoryId);
        formData.append('name', name);
        if (photoFile) formData.append('photo', photoFile);

        const res = await fetch('/api/admin/nominee', {
            method: 'POST',
            body: formData
        });
        
        const data = await res.json();
        if(data.success) {
            document.getElementById('nominee-name').value = '';
            document.getElementById('nominee-photo').value = '';
            loadDashboardData();
        } else {
            alert(data.message || 'Error adding nominee');
        }
    }

    async function deleteNominee(categoryId, nomineeId) {
        await fetch(`/api/admin/nominee/${categoryId}/${nomineeId}`, { method: 'DELETE' });
        loadDashboardData();
    }
</script>

</body>
</html>
